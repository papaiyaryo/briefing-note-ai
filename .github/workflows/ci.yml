name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: workspace_test_admin
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: workspace_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U workspace_test_admin -d workspace_test"
          --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      U1_TEST_DATABASE_URL: postgresql://workspace_test_admin:local-test-only@127.0.0.1:55432/workspace_test
      OCR_PROVIDER: dummy
      STRUCTURE_PROVIDER: dummy
      WEB_SUPPLEMENT_PROVIDER: dummy
      INTERVIEW_REVIEW_PROVIDER: dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: package-manager
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "runner=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "runner=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "runner=npm run" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ${{ steps.package-manager.outputs.manager }}

      - name: Enable Corepack
        if: steps.package-manager.outputs.manager != 'npm'
        run: corepack enable

      - name: Install dependencies
        run: ${{ steps.package-manager.outputs.install }}

      - name: Lint
        run: ${{ steps.package-manager.outputs.runner }} lint

      - name: Typecheck
        run: ${{ steps.package-manager.outputs.runner }} typecheck

      - name: Test
        run: ${{ steps.package-manager.outputs.runner }} test -- --passWithNoTests=false --coverage

      - name: Build
        run: ${{ steps.package-manager.outputs.runner }} build
